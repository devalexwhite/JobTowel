[package]
name = "jobtowel"
version = "0.1.0"
edition = "2024"
default-run = "jobtowel"

[dependencies]
ammonia = "4"
argon2 = "0.5"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
dotenvy = "0.15"
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
